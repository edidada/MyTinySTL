name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 provides gcc/g++ 11 by default
          - os: ubuntu-22.04
            cc: gcc-11
            cxx: g++-11
          # ubuntu-24.04 provides gcc/g++ 13 by default
          - os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
          # macos provides clang by default (replaces travis xcode5-8 clang)
          - os: macos-latest
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Show compiler version
        run: |
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version

      - name: Build and test
        run: |
          mkdir build && cd build
          cmake ..
          make
          cd ../bin && ./stltest
